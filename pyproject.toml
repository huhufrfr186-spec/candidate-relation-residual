[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-relation-residual"
version = "1.0.0"
description = "Transport-constrained candidate relation residual learning"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.5.1", "torchvision>=0.20.1", "numpy>=1.26", "scipy>=1.11", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
crrl = "crrl.cli:main"

[tool.setuptools.packages.find]
include = ["crrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
