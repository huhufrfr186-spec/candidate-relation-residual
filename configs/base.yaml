seed: 17
device: auto
cpu_threads: 4
data:
  train: data/dronevehicle/train.json
  val: data/dronevehicle/val.json
  test: data/dronevehicle/test.json
  image_size: [640, 512]
  workers: 0
model:
  classes: 5
  channels: 32
  output: probabilistic
  context: residual
  pretrained: true
  block: 2
  radius: 2
  eta: 0.05
  beta: 0.8
  temperature: 0.1
  sinkhorn_iterations: 200
  query_grid: [64, 80]
train:
  epochs: 24
  batch_size: 1
  accumulation: 8
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
  gradient_clip: 10.0
  evaluation_interval: 1
loss:
  assignment: unique
  center_fraction: 0.5
  box_weight: 1.0
  rgb_aux_weight: 1.0
  ir_aux_weight: 1.0
  bins:
    center_pixels: 2.0
    log_scale: 0.05
    angle_degrees: 2.0
  distribution:
    sigma_min: 0.0001
    sigma_max: 0.5
    kappa_max: 100.0
decode:
  score_threshold: 0.001
  nms_iou: 0.5
  max_detections: 300
  uniform_tolerance: 0.0001
  region_chunk_size: 2048
  refine: false
  refinement_steps: 20
